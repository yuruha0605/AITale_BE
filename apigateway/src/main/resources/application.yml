spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8080}"

  cloud:
    config:
      fail-fast: true
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      # CORS 설정 (Preflight 요청 처리를 위해 필수)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - 'http://localhost:3000'
              - 'http://localhost:5173'
            allowedMethods: 
              - 'GET'
              - 'POST'
              - 'PUT'
              - 'DELETE'
              - 'OPTIONS'
              - 'PATCH'
            allowedHeaders: '*'
            exposedHeaders: 
              - 'Authorization'
              - 'Refresh-Token'
              - 'Access-Control-Allow-Origin'
              - 'Access-Control-Allow-Credentials'
            allowCredentials: true
            maxAge: 3600