networks:
  msa-network:
    external: true
    name: msa-network

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8088:8080"
    environment:
      # 컨테이너에서는 localhost가 자기 자신이므로 Config Server는 host.docker.internal로 지정
      CONFIG_SERVER_URL: http://host.docker.internal:8080
      SPRING_CLOUD_BUS_ENABLED: "false"
    networks:
      - msa-network
    restart: unless-stopped
