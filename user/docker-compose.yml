networks:
  msa-network:
    external: true
    name: msa-network

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: user-service
      CONFIG_SERVER_URL: http://host.docker.internal:8080
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_INSTANCE_ID: user-service:8080
      EUREKA_INSTANCE_HOSTNAME: user-service
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_CLOUD_BUS_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_DATASOURCE_URL: jdbc:mariadb://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:-inspire}?useSSL=true&requireSSL=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456789}
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-aitale-super-secret-key-for-miniproj-123456789}
    networks:
      - msa-network
    restart: unless-stopped
