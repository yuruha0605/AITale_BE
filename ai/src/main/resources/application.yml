spring:
  application:
    name: ai-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8080}"
  cloud:
    config:
      fail-fast: true

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka-server:8761/eureka/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

