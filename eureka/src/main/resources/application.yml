spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://host.docker.internal:8080}
  application:
    name: eureka
  cloud:
    config:
      fail-fast: true

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
