networks:
  msa-network:
    external: true
    name: msa-network

services:
  story-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story-service
    ports:
      - "8082:8080"
    environment:
      # 컨테이너에서는 localhost가 자기 자신이므로 Config Server는 host.docker.internal로 지정
      CONFIG_SERVER_URL: http://host.docker.internal:8080
      SPRING_CLOUD_BUS_ENABLED: "false"
      # 로컬 DB/Redis를 컨테이너에서 접근하기 위한 최소 오버라이드
      SPRING_DATASOURCE_URL: jdbc:mariadb://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:-inspire}?useSSL=true&requireSSL=true
      SPRING_DATA_REDIS_HOST: host.docker.internal
    networks:
      - msa-network
    restart: unless-stopped
