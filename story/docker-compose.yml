networks:
  msa-network:
    external: true
    name: msa-network

services:
  story-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story-service
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: story-service
      CONFIG_SERVER_URL: http://host.docker.internal:8080
      SPRING_CLOUD_CONFIG_ENABLED: "true"
      SPRING_CLOUD_BUS_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_INSTANCE_ID: story-service:8080
      EUREKA_INSTANCE_HOSTNAME: story-service
      SPRING_DATASOURCE_URL: jdbc:mariadb://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:-inspire}?useSSL=true&requireSSL=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456789}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - msa-network
    restart: unless-stopped
