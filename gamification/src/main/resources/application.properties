# 1. 클라우드 설정 서버 끄기 (에러 방지 필수!)
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false

# 2. 서버 포트
server.port=8080

# 3. 데이터베이스 설정 (비밀번호: 123456789 반영)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 옵션이 주렁주렁 달린 풀 버전 주소입니다.
spring.datasource.url=jdbc:mariadb://localhost:3306/innodb?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=123456789

# 4. JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# 5. 기타 로그 설정 (쿼리 예쁘게 보기)
spring.jpa.properties.hibernate.format_sql=true