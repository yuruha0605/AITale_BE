# ==========================================================
# 1. 서버 기본 설정
# ==========================================================
server.port=8080
spring.application.name=gamification-service

# ==========================================================
# 2. 데이터베이스 연결 설정 (AWS RDS - lgcns-aitale)
# ==========================================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 스크린샷의 AWS RDS 주소와 데이터베이스명(innodb) 반영
spring.datasource.url=jdbc:mariadb://lgcns-aitale.c3smes62ye4z.ap-northeast-2.rds.amazonaws.com:3306/innodb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=true&trustServerCertificate=true
spring.datasource.username=root
spring.datasource.password=123456789

# ==========================================================
# 3. JPA / Hibernate 설정
# ==========================================================
# 개발 단계이므로 테이블 구조를 자동으로 업데이트합니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ==========================================================
# 4. 스웨거 (Swagger / OpenAPI) 설정
# ==========================================================
# 스웨거 접속 주소: http://localhost:8080/swagger-ui/index.html
# springdoc.api-docs.path=/api-docs
# springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ==========================================================
# 5. 클라우드 설정 (로컬 테스트를 위해 임시 비활성화)
# ==========================================================
# Config Server가 없어도 에러 없이 실행되도록 설정
spring.cloud.config.enabled=false
# 유레카(Eureka) 연결 시도 방지
eureka.client.enabled=false